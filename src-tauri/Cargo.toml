[package]
name = "multiaudio"
version = "0.1.0"
description = "Minimalist Per-App Desktop Audio Router & Latency Sync Mixer"
authors = ["MultiAudio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rubato = "0.15" # High-quality sinc resampler for latency compensation
ringbuf = "0.4" # Lock-free SPSC ring buffer for real-time audio threads

# Windows Audio Session API & COM bindings
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Devices_Bluetooth",
    "Win32_Foundation"
] }

# macOS CoreAudio & ScreenCaptureKit
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
objc2 = "0.5"

# Linux PipeWire & PulseAudio
[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"
libpulse-binding = "2.28"
